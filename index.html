<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Stock</title>

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="loadingScreen" class="loading">
  <div class="spinner"></div>
  <p>Carregando sistema...</p>
</div>

<div id="app" class="hidden">

  <header>
    <h1>🛒 Mercado Stock</h1>
  </header>

  <section class="form">
    <input id="nome" placeholder="Produto">
    <input id="categoria" placeholder="Categoria">
    <input id="quantidade" type="number" placeholder="Quantidade">
    <input id="valor" type="number" placeholder="Preço">
    <input id="codigo" placeholder="Código/NFC">
    <input id="estoqueMinimo" type="number" placeholder="Estoque mínimo">
    <button onclick="adicionar()">Adicionar</button>
  </section>

  <section class="resumo">
    <p>Total Produtos: <strong id="totalProdutos">0</strong></p>
    <p>Quantidade: <strong id="totalQuantidade">0</strong></p>
    <p>Valor: <strong id="valorTotal">R$0</strong></p>
  </section>

  <section class="graficos">
    <canvas id="graficoQuantidade"></canvas>
    <canvas id="graficoValor"></canvas>
  </section>

  <section>
    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Qtd</th>
          <th>Preço</th>
          <th>Total</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
