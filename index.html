<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="container">

    <!-- TOPO -->
    <header class="topo">
      <div>
        <h1>Controle de Estoque</h1>
        <p class="subtitulo">Projeto de portfólio em HTML, CSS e JavaScript</p>
      </div>

      <!-- BOTÃO TEMA -->
      <button id="btnTema" class="btn-secondary" type="button">
        🌙 Tema escuro
      </button>
    </header>

    <!-- RESUMO -->
    <section class="resumo">
      <div class="card-resumo">
        <span>Produtos cadastrados</span>
        <h3 id="totalProdutos">0</h3>
      </div>

      <div class="card-resumo">
        <span>Total de unidades</span>
        <h3 id="totalItens">0</h3>
      </div>

      <div class="card-resumo">
        <span>Valor total em estoque</span>
        <h3 id="valorTotal">R$ 0,00</h3>
      </div>
    </section>

    <!-- FORM -->
    <section class="card">
      <h2>Adicionar produto</h2>

      <form id="formProduto" class="form-grid">
        <div class="campo">
          <label>Nome</label>
          <input id="nome" required />
        </div>

        <div class="campo">
          <label>Quantidade</label>
          <input id="quantidade" type="number" required />
        </div>

        <div class="campo">
          <label>Valor</label>
          <input id="valor" type="number" required />
        </div>

        <div class="campo">
          <label>Movimentação</label>
          <select id="movimentacao">
            <option>Entrada</option>
            <option>Saída</option>
            <option>Ajuste</option>
          </select>
        </div>

        <div class="campo campo-botao">
          <button class="btn-primary">Adicionar</button>
        </div>
      </form>
    </section>

    <!-- TABELA -->
    <section class="card">
      <div class="barra-filtros">
        <input id="busca" placeholder="Buscar..." />
        <select id="ordenacao">
          <option value="nome-asc">Nome</option>
        </select>
        <button id="btnLimparEstoque" class="btn-danger">Limpar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Valor</th>
            <th>Total</th>
            <th>Status</th>
            <th>Mov</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
      </table>
    </section>

    <!-- GRÁFICOS -->
    <section class="graficos">
      <div class="card">
        <h2>Quantidade</h2>
        <canvas id="graficoQuantidade"></canvas>
      </div>

      <div class="card">
        <h2>Valor</h2>
        <canvas id="graficoValor"></canvas>
      </div>
    </section>

    <!-- HISTÓRICO -->
    <section class="card">
      <h2>Histórico</h2>

      <div class="historico-acoes">
        <button id="btnExportarCSV" class="btn-secondary">Exportar CSV</button>
        <button id="btnApagarHistorico" class="btn-danger">Apagar</button>
      </div>

      <ul id="listaHistorico"></ul>
    </section>

  </div>

  <!-- MODAL EDITAR -->
  <div id="modalEditar" class="modal-bg">
    <div class="modal">
      <h2>Editar</h2>

      <input id="editIndex" type="hidden"/>

      <input id="editNome"/>
      <input id="editQuantidade" type="number"/>
      <input id="editValor" type="number"/>
      <select id="editMovimentacao">
        <option>Entrada</option>
        <option>Saída</option>
        <option>Ajuste</option>
      </select>

      <div class="modal-actions">
        <button id="btnCancelarEdicao">Cancelar</button>
        <button id="btnSalvarEdicao">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL CONFIRMAÇÃO -->
  <div id="modalConfirmacao" class="modal-bg">
    <div class="modal">
      <h2 id="modalTitulo">Confirmar</h2>
      <p id="modalMensagem">Tem certeza?</p>

      <div class="modal-actions">
        <button id="btnCancelarAcao">Cancelar</button>
        <button id="btnConfirmarAcao">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
